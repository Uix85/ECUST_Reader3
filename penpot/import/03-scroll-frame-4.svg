<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  
  
  <title>03 滚动帧 · 帧4 · 正文上移 165px（到底）</title>
  
  
  <rect width="1920" height="1080" fill="#fff"/>
  
  
  <g id="page">
    
    
    <g id="scroll-content" transform="translate(0 -165)">
      
      
      <title>文字层 · 超高内容 · 滚动（勿勾固定）</title>
      
      
      <g id="ch-content">
        
        
      
        
        <title>正文内容（15.5px / 行高 28px）</title>
        
        
      
        
        <g id="h1-chapter">
          
          
        
          
          <title>章标题（h1）</title>
          
          
        
          
          <text x="421" y="92" font-size="24" font-weight="bold" fill="#1a1a2e">导言：作为科学体系第一部分的《精神现象学》的任务</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-1">
          
          
        
          
          <title>第 1 段</title>
          
          
        
          
          <text x="421" y="128">下面的讲座是对黑格尔著作的解释，我们都很熟知这部被冠以《</text>
          
          
        
          
          <text x="421" y="154">精神现象学》标题的著作。通过对标题及其各种不同文稿措辞的</text>
          
          
        
          
          <text x="421" y="180">讲解，我们力求先对这部著作做一个无法回避的临时性说明，以</text>
          
          
        
          
          <text x="421" y="206">便随即着手进行解释，更确切地说，绕过长篇的序言和导言，从</text>
          
          
        
          
          <text x="421" y="232">事实本身开始的地方进行解释。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-2">
          
          
        
          
          <title>第 2 段</title>
          
          
        
          
          <text x="421" y="268">这部著作通行的标题“精神现象学”当然不是原初的标题；自从</text>
          
          
        
          
          <text x="421" y="294">这个标题在1832年之后被黑格尔的朋友们采纳以来，的确对著</text>
          
          
        
          
          <text x="421" y="320">作产生了明显的字面影响。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-3">
          
          
        
          
          <title>第 3 段</title>
          
          
        
          
          <text x="421" y="356">《精神现象学》首次出版于1807年，完整标题是“科学的体系，</text>
          
          
        
          
          <text x="421" y="382">第一部分，精神现象学”；著作的内容只能从它的这种内在任务</text>
          
          
        
          
          <text x="421" y="408">出发才能得到把握。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="anchor-sec-1">
          
          
        
          
          <title>锚点①：第一节（Scroll-to 目标）</title>
          
          
        
          
          <circle cx="407" cy="464" r="4" fill="#3498db"/>
          
          
        
          
          <text x="421" y="456" font-size="20" font-weight="bold" fill="#333">第一节 现象学体系和哲学全书体系</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-4">
          
          
        
          
          <title>第 4 段</title>
          
          
        
          
          <text x="421" y="492">科学的体系在何种程度上要求《精神现象学》作为第一部分？这个</text>
          
          
        
          
          <text x="421" y="518">副标题意味着什么？在我们回答这些问题之前必须提醒，尽管这个</text>
          
          
        
          
          <text x="421" y="544">副标题后来变成唯一的标题，但它并不是完整的。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="anchor-sec-2">
          
          
        
          
          <title>锚点②：第二节（Scroll-to 目标）</title>
          
          
        
          
          <circle cx="407" cy="600" r="4" fill="#3498db"/>
          
          
        
          
          <text x="421" y="592" font-size="20" font-weight="bold" fill="#333">第二节 黑格尔对科学体系的理解</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-5">
          
          
        
          
          <title>第 5 段</title>
          
          
        
          
          <text x="421" y="628">“意识经验的科学”这个表述，此后以“精神现象学的科学”的形式</text>
          
          
        
          
          <text x="421" y="654">流传，并最终简化成了流行的“精神现象学”。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="anchor-sec-3">
          
          
        
          
          <title>锚点③：第三节（Scroll-to 目标）</title>
          
          
        
          
          <circle cx="407" cy="710" r="4" fill="#3498db"/>
          
          
        
          
          <text x="421" y="702" font-size="20" font-weight="bold" fill="#333">第三节 标明体系第一部分特征的两个标题的意义</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-6">
          
          
        
          
          <title>第 6 段</title>
          
          
        
          
          <text x="421" y="738">作为“意识经验的科学”，著作展示意识从最直接的感性确定出发、</text>
          
          
        
          
          <text x="421" y="764">逐级上升到绝对知识的内在必然过程。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="anchor-sec-4">
          
          
        
          
          <title>锚点④：第四节（Scroll-to 目标）</title>
          
          
        
          
          <circle cx="407" cy="820" r="4" fill="#3498db"/>
          
          
        
          
          <text x="421" y="812" font-size="20" font-weight="bold" fill="#333">第四节 《精神现象学》作为体系之第一部分的内在任务</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-7">
          
          
        
          
          <title>第 7 段</title>
          
          
        
          
          <text x="421" y="848">其内在任务，在于把“实体即主体”的原则落实到意识的全部形态之</text>
          
          
        
          
          <text x="421" y="874">中，使其成为体系的第一部分。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-8">
          
          
        
          
          <title>第 8 段</title>
          
          
        
          
          <text x="421" y="910">这些个别的表述差异并非无关紧要：每一次措辞的变动，都对应着</text>
          
          
        
          
          <text x="421" y="936">黑格尔对这门科学之地位、方法与对象的重塑。我们既不能把“精神</text>
          
          
        
          
          <text x="421" y="962">现象学”理解为一个孤立的标题，也不能把它当作体系之外的附属品。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-9">
          
          
        
          
          <title>第 9 段</title>
          
          
        
          
          <text x="421" y="998">因此，阅读《精神现象学》的首要任务，是澄清其标题与副标题之间</text>
          
          
        
          
          <text x="421" y="1024">的关系，并由此把握著作在体系中的位置。只有在这个位置被确定之</text>
          
          
        
          
          <text x="421" y="1050">03 滚动帧 帧4 · 正文上移 165px（到底）｜固定层全在原位，仅正文上移 165px</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-10">
          
          
        
          
          <title>第 10 段（视口 1080 以下的内容）</title>
          
          
        
          
          <text x="421" y="1086">换言之，这部著作既是一个自足的论证整体，又是更大体系的一个环</text>
          
          
        
          
          <text x="421" y="1112">节；它的每一个概念、每一个过渡，都同时服务于双重目的。</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="anchor-sec-5">
          
          
        
          
          <title>锚点⑤：第五节（Scroll-to 目标 · 在视口下方）</title>
          
          
        
          
          <circle cx="407" cy="1194" r="4" fill="#3498db"/>
          
          
        
          
          <text x="421" y="1186" font-size="20" font-weight="bold" fill="#333">第五节 关于文献、术语与阅读态度的简短提示</text>
          
          
      
        
        </g>
        
        
      
        
        <g id="p-11">
          
          
        
          
          <title>第 11 段</title>
          
          
        
          
          <text x="421" y="1222">本节提示与文献相关的术语用法与阅读时的内心态度，帮助读者在进</text>
          
          
        
          
          <text x="421" y="1248">入正文之前先行建立基本的坐标系。</text>
          
          
      
        
        </g>
        
        
    
      
      </g>
      
    
    </g>
    
    
    <g id="fixed-layer">
      
      
      <title>固定层 · 不滚动（导入后勾「滚动时保持固定」）</title>
      
      
      <g id="browser-bar">
        
        
    
        
        <title>浏览器外壳侧边栏（52px）</title>
        
        
    
        
        <rect x="0" y="0" width="52" height="1080" fill="#eceff1"/>
        
        
    
        
        <line x1="51.5" y1="0" x2="51.5" y2="1080" stroke="#d5d9dd"/>
        
        
    
        
        <g id="bb-home">
          
          
      
          
          <title>主页 Library</title>
          
          
      
          
          <rect x="10" y="10" width="32" height="32" rx="6" fill="#fff" stroke="#d5d9dd"/>
          
          
      
          
          <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a5560">L</text>
          
          
    
        
        </g>
        
        
    
        
        <line x1="10" y1="54" x2="42" y2="54" stroke="#d5d9dd"/>
        
        
    
        
        <g id="bb-toc">
          
          
      
          
          <title>目录（点击打开目录叠加层）</title>
          
          
      
          
          <rect x="10" y="64" width="32" height="32" rx="6" fill="#5b9bd5"/>
          
          
      
          
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" transform="translate(18 72) scale(0.6667)" fill="#fff"/>
          
          
    
        
        </g>
        
        
    
        
        <g id="bb-aux">
          
          
      
          
          <title>辅助键</title>
          
          
      
          
          <rect x="10" y="102" width="32" height="32" rx="6" fill="#fff" stroke="#d5d9dd"/>
          
          
      
          
          <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z" transform="translate(18 110) scale(0.6667)" fill="#4a5560"/>
          
          
    
        
        </g>
        
        
    
        
        <g id="bb-concept">
          
          
      
          
          <title>解释笔</title>
          
          
      
          
          <rect x="10" y="140" width="32" height="32" rx="6" fill="#fff" stroke="#d5d9dd"/>
          
          
      
          
          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" transform="translate(18 148) scale(0.6667)" fill="#4a5560"/>
          
          
    
        
        </g>
        
        
  
      
      </g>
      
      
      <g id="ch-title-bar">
        
        
    
        
        <title>章标题栏（固定吸顶 · sticky 近似）</title>
        
        
    
        
        <rect x="52" y="0" width="1868" height="56" fill="#fff"/>
        
        
    
        
        <line x1="52" y1="56" x2="1920" y2="56" stroke="#e9ecef"/>
        
        
    
        
        <rect x="421" y="0" width="700" height="56" fill="#fff"/>
        
        
    
        
        <line x1="421" y1="56" x2="1121" y2="56" stroke="#3498db" stroke-width="2"/>
        
        
    
        
        <text x="421" y="36" font-size="24" font-weight="bold" fill="#1a1a2e">导言：作为科学体系第一部分的《精神现象学》的任务</text>
        
        
  
      
      </g>
      
      
      <rect x="52" y="56" width="1868" height="1024" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35"/>
      
      
      <g id="scrollbar-hint">
        
        
      
        
        <title>滚动条提示</title>
        
        
      
        
        <rect x="1907" y="56" width="6" height="1024" rx="3" fill="#e9ecef"/>
        
        
      
        
        <rect x="1907" y="56" width="6" height="200" rx="3" fill="#ced4da"/>
        
        
    
      
      </g>
      
      
      <g id="ch-nav">
        
        
    
        
        <title>底部浮动翻章条</title>
        
        
    
        
        <rect x="824" y="1018" width="400" height="42" rx="21" fill="#fff" stroke="#dee2e6"/>
        
        
    
        
        <circle cx="850" cy="1039" r="15" fill="#3498db"/>
        
        
    
        
        <text x="850" y="1045" text-anchor="middle" font-size="15" fill="#fff">◀</text>
        
        
    
        
        <text x="1024" y="1044" text-anchor="middle" font-size="14" fill="#495057">3 / 11</text>
        
        
    
        
        <circle cx="1182" cy="1039" r="15" fill="#3498db"/>
        
        
    
        
        <text x="1182" y="1045" text-anchor="middle" font-size="15" fill="#fff">▶</text>
        
        
  
      
      </g>
      
    
    </g>
    
  
  </g>
  
  
  <text x="52" y="1050" font-size="12" fill="#adb5bd">素材 03 · 重组后层级：背景 &lt; #scroll-content(文字·滚动) &lt; #fixed-layer(固定·勾「滚动时保持固定」)｜02 系列目录素材不动</text>
  
  
  <text x="52" y="1068" font-size="12" fill="#adb5bd">
    素材 03 · 重组后层级：背景 &lt; #scroll-content(文字·滚动) &lt; #fixed-layer(固定·勾「滚动时保持固定」)｜02 系列目录素材不动
    固定层 = browser-bar + 章标题栏(蓝线以上) + 视口虚线 + 滚动条 + 翻章条；文字层 = #scroll-content 内正文
  </text>
  

</svg>
