<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.metadata.title }}</title>
    <style>
        body { margin:0; padding:0; display:flex; height:100vh; overflow:hidden; font-family:Georgia,serif; background:#fff; }

        #side-wrap { position:relative; display:flex; flex-direction:column; flex-shrink:0; width:280px; min-width:0; transition:width .25s; margin-left:52px; }
        #side-wrap.collapsed { width:76px; }
        #side-wrap.collapsed #sidebar,
        #side-wrap.collapsed #resizer { display:none; }

        #topbar { display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:10px; padding:0 12px; height:44px; box-sizing:border-box; background:#f8f9fa; border-bottom:1px solid #e9ecef; }
        #topbar.collapsed { flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:6px; padding:8px 10px; height:auto; border-bottom:none; background:#fff; }

        #sidebar { flex-grow:1; min-width:0; background:#f8f9fa; border-right:1px solid #e9ecef; overflow-y:auto; padding:12px 12px 16px; }

        /* 侧栏右缘拖拽调宽 */
        #resizer { position:absolute; top:0; right:-3px; width:6px; height:100%; cursor:col-resize; z-index:120; transition:background .15s; }
        #resizer:hover { background:rgba(52,152,219,.25); }
        .nav-home { display:block; color:#3498db; text-decoration:none; font-family:-apple-system,sans-serif; font-size:.85em; white-space:nowrap; }
        .panel-header { font-family:-apple-system,sans-serif; font-size:.8em; font-weight:bold; color:#868e96; letter-spacing:.5px; margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid #dee2e6; }

        /* ── 章 ── */
        .ch-item { margin-bottom:6px; }
        .ch-row { display:flex; align-items:center; }
        .ch-link { flex:1; text-decoration:none; color:#495057; font-size:.9em; font-weight:500; padding:5px 10px; border-radius:4px; line-height:1.35; font-family:-apple-system,sans-serif; cursor:pointer; }
        .ch-link:hover { background:rgba(52,152,219,.08); }
        .ch-link.active { background:#3498db; color:#fff; font-weight:bold; }
        .ch-toggle { display:inline-grid; grid-template-columns:4px 4px; grid-template-rows:4px 4px; gap:3px; cursor:pointer; user-select:none; flex-shrink:0; opacity:.5; transition:opacity .15s; padding:6px 8px; margin-right:2px; align-self:center; }
        .ch-toggle:hover { opacity:.8; }
        .ch-toggle.open { opacity:1; }
        .ch-toggle i { display:block; width:4px; height:4px; background:#495057; border-radius:1px; }
        .ch-toggle.open i { background:#3498db; }

        /* ── 节框 ── */
        .section-box { border:1px solid #e9ecef; border-radius:6px; background:#fbfcfd; padding:4px 6px; margin:4px 0 8px 0; overflow:hidden; transition:max-height .2s,opacity .15s,padding .2s,margin .2s; }
        .section-box.collapsed { max-height:0!important; opacity:0; padding-top:0; padding-bottom:0; margin-top:0; margin-bottom:0; border-width:0; }
        .sec-link { display:block; flex:1; min-width:0; text-decoration:none; color:#4a5568; font-size:.85em; padding:4px 8px; border-radius:3px; line-height:1.35; font-family:-apple-system,sans-serif; cursor:pointer; }
        .sec-link:hover { background:rgba(0,0,0,.03); color:#2d3748; }
        .sec-link.active { color:#1a202c; font-weight:600; background:rgba(0,0,0,.045); }
        .sec-link.d1 { padding-left:2px; }
        .sec-link.d2 { padding-left:4px; font-size:.82em; }
        .sec-link.d3 { padding-left:6px; font-size:.79em; }
        .sec-link.d4 { padding-left:10px; font-size:.76em; }

        /* ── 节内子级折叠 ── */
        .sec-row { display:flex; align-items:center; }
        .sec-toggle { width:20px; height:28px; flex-shrink:0; cursor:pointer; user-select:none; opacity:.35; transition:opacity .15s,transform .15s; font-size:18px; display:flex; align-items:center; justify-content:center; margin-right:2px; }
        .sec-toggle:hover { opacity:.7; }
        .sec-toggle.open { transform:rotate(90deg); }
        .sec-kids { overflow:hidden; transition:max-height .2s,opacity .15s; }
        .sec-kids.collapsed { max-height:0!important; opacity:0; }
        /* 章/节统一：右侧上锁图标（灰色图钉，Edge 风格） */
        .lock-icon { margin-left:auto; cursor:pointer; display:flex; align-items:center; justify-content:center; width:18px; height:18px; opacity:.3; user-select:none; flex-shrink:0; color:#6c757d; }
        .lock-icon svg { width:13px; height:13px; fill:currentColor; }
        .lock-icon:hover { opacity:.85; }
        .lock-icon.locked { opacity:1; }
        /* 层级缩进：一级节标题与章标题对齐，每深一层缩进一个字符 */
        .sec-row.d1 { padding-left:8px; }
        .sec-row.d2 { padding-left:20px; }
        .sec-row.d3 { padding-left:32px; }
        .sec-row.d4 { padding-left:42px; }

        #main { flex-grow:1; min-width:0; overflow-y:auto; position:relative; scroll-behavior:smooth; }
        /* 正文左移：左侧空白减半（原居中左右各半 → 左侧 1/4，右侧 3/4；按含 padding 总宽 780 算） */
        #chapter-view { position:relative; max-width:700px; margin:0 auto 0 calc((100% - 780px) / 4); padding:40px 40px 120px; }
        .ch-title-bar { display:flex; align-items:center; gap:12px; font-family:-apple-system,sans-serif; font-size:1.6em; font-weight:bold; color:#1a1a2e; padding:16px 0 12px; margin-bottom:20px; border-bottom:2px solid #3498db; position:sticky; top:0; background:linear-gradient(180deg,#fff 70%,rgba(255,255,255,0)); z-index:10; backdrop-filter:blur(4px); }
        .ch-title-bar #ch-title { flex:1; min-width:0; word-break:break-word; }
        .ch-content { line-height:1.8; font-size:1.15em; color:#212529; }
        .ch-content p { margin-bottom:1.5em; text-align:justify; }
        .ch-content img { max-width:100%; height:auto; display:block; margin:20px auto; }
        .ch-content h1,.ch-content h2,.ch-content h3 { font-family:-apple-system,sans-serif; margin-top:1.5em; color:#333; scroll-margin-top:80px; }
        .ch-content span[id] { scroll-margin-top:100px; }
        .ch-content a { color:#2d6cdf; text-decoration:none; cursor:pointer; }
        .ch-content a:hover { text-decoration:underline; }

        #ch-loading { text-align:center; padding:60px; display:none; }
        #ch-loading .spinner { display:inline-block; width:28px; height:28px; border:3px solid #e9ecef; border-top-color:#3498db; border-radius:50%; animation:spin .6s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }

        #sidebar-toggle { width:28px; height:28px; flex-shrink:0; border:1px solid #dee2e6; border-radius:6px; background:#fff; cursor:pointer; font-size:16px; line-height:26px; text-align:center; color:#495057; box-shadow:0 1px 4px rgba(0,0,0,.06); padding:0; }
        #sidebar-toggle:hover { background:#f1f3f5; }

        #ch-nav { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:16px; background:rgba(255,255,255,.95); border:1px solid #dee2e6; border-radius:24px; padding:8px 20px; box-shadow:0 2px 12px rgba(0,0,0,.06); z-index:20; font-family:-apple-system,sans-serif; font-size:.9em; }
        #ch-nav button { border:none; background:none; cursor:pointer; font-size:1.1em; color:#495057; padding:4px 8px; border-radius:4px; }
        #ch-nav button:hover { background:#f1f3f5; color:#3498db; }
        #ch-nav span { color:#868e96; white-space:nowrap; }

        /* ── 概念层：笔触开关 + 选中高亮 + 悬停弹窗 ── */
        #concept-toggle, #aux-toggle { width:28px; height:28px; flex-shrink:0; border:1px solid #dee2e6; border-radius:6px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#495057; box-shadow:0 1px 4px rgba(0,0,0,.06); padding:0; font-size:14px; line-height:1; }
        #concept-toggle:hover, #aux-toggle:hover { background:#f1f3f5; }
        #concept-toggle.active, #aux-toggle.active { background:#3498db; border-color:#3498db; color:#fff; }
        #concept-toggle svg { width:15px; height:15px; fill:currentColor; }
        .ch-content mark.concept-hl { background:#fff3bf; color:inherit; border-radius:2px; padding:0 1px; cursor:pointer; }
        .ch-content mark.concept-hl:hover { background:#ffd43b; }
        /* 语义下划线：开启显示、关闭隐藏（.off）、悬停书签时临时显现 */
        .ch-content mark.semantic-hl { background:transparent; color:inherit; border-bottom:2px solid #4da3d6; padding:0 1px; cursor:pointer; }
        .ch-content mark.semantic-hl.off { border-bottom-color:transparent; }
        .ch-content mark.semantic-hl:hover { background:rgba(77,163,214,.12); }
        /* ── 语义层：蓝色下划线 + 段落左侧书签（序号）+ 段落右侧弹窗 ── */
        /* 书签：矩形尾巴(数字) + 三角形尖端(指向正文)，2 倍尺寸；开启=深色，关闭=浅色 */
        .sem-bookmark { position:absolute; left:-66px; display:flex; align-items:center; cursor:pointer; z-index:40; background:transparent; border:none; padding:0; user-select:none; }
        .sem-bookmark .bm-rect { width:32px; height:44px; background:#a5d8ff; border-radius:6px 0 0 6px; box-shadow:0 2px 6px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; }
        .sem-bookmark .bm-num { font-family:-apple-system,sans-serif; font-size:20px; font-weight:bold; color:#fff; line-height:1; }
        .sem-bookmark .bm-tri { width:0; height:0; border-top:22px solid transparent; border-bottom:22px solid transparent; border-left:26px solid #a5d8ff; }
        .sem-bookmark:hover .bm-rect { background:#74c0fc; }
        .sem-bookmark:hover .bm-tri { border-left-color:#74c0fc; }
        .sem-bookmark.active .bm-rect { background:#4da3d6; }
        .sem-bookmark.active .bm-tri { border-left-color:#4da3d6; }
        /* 弹窗（概念/语义共用）：白底淡蓝边框，标题栏 + 右上角图钉 + 右下角拉伸（无大小边界） */
        .semantic-pop { position:absolute; z-index:500; width:320px; height:400px; background:#fff; border:1px solid #a5d8ff; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.08); display:flex; flex-direction:column; font-family:-apple-system,sans-serif; font-size:.85em; }
        .semantic-pop .sp-title { flex-shrink:0; padding:8px 40px 6px 12px; font-weight:bold; color:#1a1a2e; border-bottom:1px solid #eef3f7; font-size:.9em; word-break:break-all; cursor:move; }
        .semantic-pop.dragging { opacity:.92; user-select:none; }
        .semantic-pop .sp-pin { position:absolute; top:8px; right:26px; width:18px; height:18px; cursor:pointer; color:#6c757d; opacity:.5; z-index:2; display:flex; align-items:center; justify-content:center; }
        .semantic-pop .sp-pin:hover { opacity:1; }
        .semantic-pop .sp-pin.locked { opacity:1; }
        .semantic-pop .sp-pin svg { width:13px; height:13px; fill:currentColor; }
        .semantic-pop .sp-body { flex:1; overflow-y:auto; padding:10px 12px; line-height:1.6; color:#2b4a63; word-break:break-word; }
        .semantic-pop .sp-body p { margin:.35em 0; }
        .semantic-pop .sp-body h1, .semantic-pop .sp-body h2, .semantic-pop .sp-body h3,
        .semantic-pop .sp-body h4, .semantic-pop .sp-body h5, .semantic-pop .sp-body h6 { margin:.6em 0 .3em; font-size:1.05em; color:#1a1a2e; }
        .semantic-pop .sp-body ul, .semantic-pop .sp-body ol { margin:.3em 0; padding-left:1.3em; }
        .semantic-pop .sp-body li { margin:.15em 0; }
        .semantic-pop .sp-body code { background:#eef3f7; border-radius:3px; padding:0 3px; font-size:.92em; }
        .semantic-pop .sp-body pre { background:#eef3f7; border-radius:6px; padding:8px 10px; overflow-x:auto; margin:.5em 0; }
        .semantic-pop .sp-body pre code { background:none; padding:0; }
        .semantic-pop .sp-body a { color:#2d6cdf; }
        .semantic-pop .sp-body hr { border:none; border-top:1px solid #dee2e6; margin:.6em 0; }
        .semantic-pop .sp-resize { position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize; }
        .semantic-pop .sp-resize::after { content:''; position:absolute; right:3px; bottom:3px; width:8px; height:8px; border-right:2px solid #a5d8ff; border-bottom:2px solid #a5d8ff; }
    </style>
</head>
<body>

<script>window.BROWSER_BOOK_ID = {{ book_id | tojson }}; window.BROWSER_BOOK_TITLE = {{ book.metadata.title | tojson }};</script>
{% include 'browser_bar.html' %}
{% include 'markdown_render.js' %}

<div id="side-wrap">
    <div id="topbar">
        <a href="/" class="nav-home">&larr; 书库</a>
        <button id="sidebar-toggle" onclick="toggleSidebar()" title="目录">&#9776;</button>
    </div>
    <div id="sidebar">
        <div class="panel-header">目 录</div>
        <div id="toc-tree"></div>
    </div>
    <div id="resizer" title="拖动调整目录宽度"></div>
</div>

<div id="main">
    <div id="chapter-view">
        <div class="ch-title-bar" id="ch-title-bar">
            <span id="ch-title">{{ chapter_title }}</span>
            <button id="aux-toggle" title="笔记界面（全书层 / 章节层）">&#10022;</button>
            <button id="concept-toggle" title="辅助阅读：选中短词→概念弹窗，选中长句/段→两侧语义面板">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
        </div>
        <div class="ch-content" id="ch-content">{{ chapter_content | safe }}</div>
    </div>
    <div id="ch-loading"><div class="spinner"></div></div>
</div>

<div id="ch-nav">
    <button id="ch-nav-prev" onclick="goChapter(-1)" title="上一章">&#9664;</button>
    <span id="ch-nav-label"></span>
    <button id="ch-nav-next" onclick="goChapter(1)" title="下一章">&#9654;</button>
</div>

<script>
var BOOK_ID = "{{ book_id }}";
var TOTAL = {{ total_chapters }};
var currentChapter = {{ chapter_idx }};

{% macro toc_json(items) %}
[{% for item in items %}{
    "title": {{ item.title | tojson }},
    "href": {{ item.href | tojson }},
    "children": {{ toc_json(item.children) if item.children else '[]' }}
}{% if not loop.last %},{% endif %}{% endfor %}]
{% endmacro %}
var tocTree = {{ toc_json(heading_toc) }};
var anchorMap = {{ anchor_map | tojson }};  // anchor id → 章节索引（正文内超链接跳转）

var mainEl = document.getElementById('main');

// ── 构建 TOC ──
function buildToc() {
    var root = document.getElementById('toc-tree');
    root.innerHTML = '';
    for (var i = 0; i < tocTree.length; i++) {
        root.appendChild(buildChapter(tocTree[i], i));
    }
}

function buildChapter(ch, idx) {
    var div = document.createElement('div');
    div.className = 'ch-item';

    var hasKids = ch.children && ch.children.length > 0;

    // 节框先建（折叠/上锁统一引用）
    var box = document.createElement('div');
    box.className = 'section-box';

    var row = document.createElement('div');
    row.className = 'ch-row';

    var toggle = document.createElement('span');
    toggle.className = 'ch-toggle';
    toggle.style.visibility = hasKids ? 'visible' : 'hidden';
    toggle.onclick = makeFoldHandler(box, toggle);
    // 四个小方块
    for (var s = 0; s < 4; s++) { var sq = document.createElement('i'); toggle.appendChild(sq); }
    row.appendChild(toggle);

    var link = document.createElement('a');
    link.className = 'ch-link';
    link.textContent = ch.title;
    link.href = '#';
    row.appendChild(link);
    div.appendChild(row);

    // 节框
    if (hasKids) {
        box.classList.add('collapsed');
        buildSections(ch.children, box, idx, 1, null);
        addLockIcon(row, box, toggle);   // 统一：右侧上锁图标
        setupLinkInteractions(link, function() { loadChapter(idx); }, box);  // 有子节：双击=上锁
    } else {
        box.style.display = 'none';
        setupLinkInteractions(link, function() { loadChapter(idx); }, null);  // 无子节：直接跳转
    }
    div.appendChild(box);
    // 存引用用于折叠
    div._sectionBox = box;
    div._toggle = toggle;

    return div;
}

function buildSections(children, container, chapterIdx, depth, parentEl) {
    for (var i = 0; i < children.length; i++) {
        var s = children[i];
        var hasKids = s.children && s.children.length > 0;

        // 行容器：节链接 + 折叠按钮
        var row = document.createElement('div');
        row.className = 'sec-row d' + depth;

        // 折叠按钮（有子节时显示 ▸）
        var stoggle = document.createElement('span');
        stoggle.className = 'sec-toggle';
        stoggle.textContent = hasKids ? '\u25B8' : '';
        stoggle.style.visibility = hasKids ? 'visible' : 'hidden';
        row.appendChild(stoggle);

        var link = document.createElement('a');
        link.className = 'sec-link d' + depth;
        link.textContent = s.title;
        link.href = '#';
        let anchor = (s.href || '').split('#')[1] || '';   // let：块级作用域，闭包各自捕获
        link.setAttribute('data-anchor', anchor);
        link._parentSection = parentEl;
        let doSectionNav = function() {
            if (currentChapter !== chapterIdx) {
                loadChapter(chapterIdx, 'top', anchor);
            } else {
                scrollToSection(anchor);
            }
        };
        row.appendChild(link);
        container.appendChild(row);

        // 子节容器（默认折叠）
        if (hasKids) {
            let kids = document.createElement('div');   // let：块级作用域，闭包各自捕获
            kids.className = 'sec-kids collapsed';
            stoggle.onclick = makeFoldHandler(kids, stoggle);
            addLockIcon(row, kids, stoggle);   // 统一：右侧上锁图标
            setupLinkInteractions(link, doSectionNav, kids);  // 有子节：双击=上锁
            buildSections(s.children, kids, chapterIdx, depth + 1, link);
            container.appendChild(kids);
        } else {
            setupLinkInteractions(link, doSectionNav, null);  // 无子节：直接跳转
        }
    }
}

// ── 折叠/展开通用助手（章节框与子节容器共用）──
function toggleCollapse(el, toggle) {
    if (!el) return;
    if (el.classList.contains('collapsed')) {
        el.classList.remove('collapsed');
        el.style.maxHeight = el.scrollHeight + 'px';
        if (toggle) toggle.classList.add('open');
        setTimeout(function() { el.style.maxHeight = ''; }, 50);
    } else {
        el.style.maxHeight = el.scrollHeight + 'px';
        void el.offsetHeight;
        el.classList.add('collapsed');
        if (toggle) toggle.classList.remove('open');
    }
}

// ── 章/节统一的折叠 + 上锁逻辑（章节框 .section-box 与节容器 .sec-kids 共用）──
// 折叠键：展开 → 默认上锁（固定展开，不被自动折叠）；折叠 → 默认解锁（回归初始状态）
function makeFoldHandler(el, toggle) {
    return function(e) {
        e.stopPropagation();
        if (!el) return;
        el._locked = el.classList.contains('collapsed');
        toggleCollapse(el, toggle);
        updateLockIcon(el);
    };
}

// 上锁图标：灰色图钉（Edge 锁定标签页风格），内嵌 SVG
// 锁定 = 实心图钉；未锁定 = 空心图钉
var LOCK_ICON_PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16,9V4h1c0.55,0 1,-0.45 1,-1v0c0,-0.55 -0.45,-1 -1,-1H7C6.45,2 6,2.45 6,3v0c0,0.55 0.45,1 1,1h1v5c0,1.66 -1.34,3 -3,3v2h5.97v7l1,1l1,-1v-7H19v-2C17.34,12 16,10.66 16,9z"/></svg>';
var LOCK_ICON_UNPIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16,9V4h1c0.55,0 1,-0.45 1,-1v0c0,-0.55 -0.45,-1 -1,-1H7C6.45,2 6,2.45 6,3v0c0,0.55 0.45,1 1,1h1v5c0,1.66 -1.34,3 -3,3v2h5.97v7l1,1l1,-1v-7H19v-2C17.34,12 16,10.66 16,9z M14.83,4H9.17v4.37c0,1.32 -0.83,2.42 -2,2.83V13h9.66v-1.8C16.66,10.79 15.83,9.69 15.83,8.37V4z"/></svg>';

function updateLockIcon(el) {
    var icon = el._lockEl;
    if (!icon) return;
    icon.innerHTML = el._locked ? LOCK_ICON_PIN : LOCK_ICON_UNPIN;
    icon.classList.toggle('locked', !!el._locked);
}

// 是否含上锁后代（上锁的节要求其祖先保持展开）
function hasLockedDescendant(el) {
    return !!el.querySelector('.lock-icon.locked');
}

function isInActiveChain(el) {
    var active = document.querySelector('.sec-link.active');
    var activeCh = active ? active.closest('.ch-item') : tocItems[currentChapter];
    if (activeCh && activeCh._sectionBox === el) return true;
    for (var cur = active; cur && cur.classList.contains('sec-link'); cur = cur._parentSection) {
        if (getSecKids(cur) === el) return true;
    }
    return false;
}

// 双击标题 / 点击上锁图标：切换固定展开
function toggleLock(el) {
    el._locked = !el._locked;
    if (el._locked) {
        if (el.classList.contains('collapsed')) toggleCollapse(el, el._toggleEl);
    } else if (!el.classList.contains('collapsed') && !isInActiveChain(el)) {
        toggleCollapse(el, el._toggleEl);  // 解锁：不在当前阅读链则收起
    }
    updateLockIcon(el);
}

function addLockIcon(row, el, toggle) {
    el._toggleEl = toggle;
    var icon = document.createElement('span');
    icon.className = 'lock-icon';
    icon.title = '点击锁定/解锁（锁定后不会被自动折叠）';
    icon.onclick = function(e) { e.stopPropagation(); toggleLock(el); };
    row.appendChild(icon);
    el._lockEl = icon;
    updateLockIcon(el);
}

// 链接点击防误判：250ms 内第二次点击视为双击 → 取消跳转、只上锁
function setupLinkInteractions(link, doNav, lockTarget) {
    if (!lockTarget) {
        link.addEventListener('click', function(e) {
            if (e.button !== 0) return;
            e.preventDefault();
            doNav();
        });
        return;
    }
    var timer = null;
    link.addEventListener('click', function(e) {
        if (e.button !== 0) return;
        e.preventDefault();
        if (timer) { clearTimeout(timer); timer = null; return; }  // 双击第二击 → 取消跳转
        timer = setTimeout(function() { timer = null; doNav(); }, 250);
    });
    link.addEventListener('dblclick', function(e) {
        e.preventDefault();
        if (timer) { clearTimeout(timer); timer = null; }
        toggleLock(lockTarget);
    });
}

buildToc();

// 侧栏章列表（静态，一次性查询缓存）
var tocItems = document.querySelectorAll('#toc-tree > .ch-item');

// ── 展开当前章；跨章导航时收起其他章框（导航即离开）──
function expandCurrentChapter(idx) {
    var items = tocItems;
    items.forEach(function(div, i) {
        var link = div.querySelector('.ch-link');
        if (link) link.classList.toggle('active', i === idx);
        var box = div._sectionBox;
        var isCurrent = (i === idx);
        if (box) {
            if (isCurrent) {
                // 展开当前章（手动折叠后回归初始，会重新展开）
                if (box.classList.contains('collapsed')) toggleCollapse(box, div._toggle);
            } else if (!box.classList.contains('collapsed') && !box._locked && !hasLockedDescendant(box)) {
                // 导航到新章：收起其他章框；上锁的（或含上锁后代的）除外
                toggleCollapse(box, div._toggle);
            }
        }
        var tgl = div._toggle;
        if (tgl) {
            var isOpen = (isCurrent && box && !box.classList.contains('collapsed'));
            tgl.classList.toggle('open', isOpen);
        }
    });
}

// ── 多级联动高亮 ──
function highlightSectionLink(anchor) {
    document.querySelectorAll('.sec-link.active').forEach(function(l) { l.classList.remove('active'); });
    if (!anchor) return null;
    var link = document.querySelector('.sec-link[data-anchor="' + CSS.escape(anchor) + '"]');
    if (!link) return null;
    for (var cur = link; cur && cur.classList.contains('sec-link'); cur = cur._parentSection) {
        cur.classList.add('active');
    }
    link.scrollIntoView({ block: 'nearest' });
    return link;
}

// ── 预计算锚点位置，滚动时纯数组查找 ──
var _highlightSuppress = false;
var _sectionRanges = [];
var _autoCollapseArmed = false;  // 仅用户滚动后才启用自动折叠（避免翻章瞬间误折叠）
var _suppressCollapseOnce = false;  // 点击跳转产生的滚动不触发自动折叠（避免折叠跳转前所在的节）
var _suppressTimer = null;  // 跳转标志兜底清除定时器

function getBarH() {
    var bar = document.getElementById('ch-title');
    return bar ? bar.offsetHeight + 10 : 20;
}

function computeRanges() {
    _sectionRanges = [];
    var links = document.querySelectorAll('.sec-link[data-anchor]');
    if (links.length === 0) return;
    var mt = mainEl.getBoundingClientRect().top;
    for (var i = 0; i < links.length; i++) {
        var anchor = links[i].getAttribute('data-anchor');
        var el = document.getElementById(anchor);
        if (!el) continue;
        _sectionRanges.push({ anchor: anchor, top: el.getBoundingClientRect().top - mt + mainEl.scrollTop });
    }
    _sectionRanges.sort(function(a, b) { return a.top - b.top; });
}

var _prevAnchor = null;  // 上一次 active 的节锚点（用于检测“离开某部分”）

function updateHighlight(skipCollapse) {
    var viewTop = mainEl.scrollTop + getBarH();
    var link = null;
    if (_sectionRanges.length > 0) {
        var active = null;
        for (var i = 0; i < _sectionRanges.length; i++) {
            if (_sectionRanges[i].top <= viewTop + 5) active = _sectionRanges[i].anchor;
            else break;
        }
        link = highlightSectionLink(active);
    }
    // 检测式滚离即收：armed 且非跳转且 active 切换时，折叠“离开的部分”
    if (_autoCollapseArmed && !skipCollapse) collapseLeaving(link);
    // 始终展开当前 active 的祖先链（手动收起的除外）
    expandActiveChain(link);
    if (link) _prevAnchor = link.getAttribute('data-anchor');
}

function getSecKids(link) {
    var row = link && link.parentNode;
    if (row && row.classList.contains('sec-row')) {
        var kids = row.nextElementSibling;
        if (kids && kids.classList.contains('sec-kids')) return kids;
    }
    return null;
}

// ── 检测式“滚离即收” ──
// 逻辑：仅当 active 从某部分切换到另一部分（进入上/下一部分）时，折叠“离开的部分”；
// 未滚到的部分（前方）与未离开的部分一律不动。
function collapseLeaving(activeLink) {
    if (!activeLink || !_prevAnchor) return;
    var curAnchor = activeLink.getAttribute('data-anchor');
    if (curAnchor === _prevAnchor) return;          // active 未变
    var prevLink = document.querySelector('.sec-link[data-anchor="' + CSS.escape(_prevAnchor) + '"]');
    if (!prevLink) return;
    if (prevLink.contains(activeLink)) return;      // 新旧同部分内加深 → 未离开
    // 找“离开的部分”：公共祖先之下、旧分支的那一层（旧 active 自身或某祖先）
    var chain = [];
    for (var p = prevLink; p && p.classList.contains('sec-link'); p = p._parentSection) chain.push(p);
    var left = prevLink;
    for (var i = 0; i < chain.length; i++) {
        if (chain[i].contains(activeLink)) break;   // 公共祖先（新 active 在其内）→ 停止
        left = chain[i];                            // 尚未被新 active 覆盖 → 属于离开的部分
    }
    foldSubtree(left);
}

function foldSubtree(link) {
    var kids = getSecKids(link);
    // 上锁的（或含上锁后代的）不折叠
    if (!kids || kids.classList.contains('collapsed') || kids._locked || hasLockedDescendant(kids)) return;
    var tg = kids.previousElementSibling ? kids.previousElementSibling.querySelector('.sec-toggle') : null;
    toggleCollapse(kids, tg);
}

// 展开 active 自身 + 祖先链的子节容器 + 所在章框
function expandActiveChain(activeLink) {
    var activeCh = activeLink ? activeLink.closest('.ch-item') : tocItems[currentChapter];
    if (activeCh) {
        var box = activeCh._sectionBox;
        if (box && box.classList.contains('collapsed')) toggleCollapse(box, activeCh._toggle);
    }
    for (var cur = activeLink; cur && cur.classList.contains('sec-link'); cur = cur._parentSection) {
        var kids = getSecKids(cur);
        if (kids && kids.classList.contains('collapsed')) {
            var tg = kids.previousElementSibling ? kids.previousElementSibling.querySelector('.sec-toggle') : null;
            toggleCollapse(kids, tg);
        }
    }
}

mainEl.addEventListener('scroll', function() {
    var jump = _suppressCollapseOnce;  // 点击跳转产生的滚动不启用自动折叠
    _suppressCollapseOnce = false;
    if (!jump) _autoCollapseArmed = true;  // 用户真实滚动后才允许自动折叠
    if (!_highlightSuppress) updateHighlight(jump);
}, { passive: true });

// resize debounce
var _rzTimer;
window.addEventListener('resize', function() {
    clearTimeout(_rzTimer);
    _rzTimer = setTimeout(computeRanges, 200);
});

function scrollToSection(anchor) {
    var el = document.getElementById(anchor);
    if (!el) return;
    var mt = mainEl.getBoundingClientRect().top;
    mainEl.style.scrollBehavior = 'auto';
    _suppressCollapseOnce = true;  // 本次跳转产生的滚动不触发自动折叠
    clearTimeout(_suppressTimer);
    _suppressTimer = setTimeout(function() { _suppressCollapseOnce = false; }, 500);  // 兜底：无实际滚动时清除标志
    mainEl.scrollTop = Math.max(0, el.getBoundingClientRect().top - mt + mainEl.scrollTop - getBarH());
    requestAnimationFrame(function() { mainEl.style.scrollBehavior = 'smooth'; });
}

// ── 章加载 ──
var chLock = false;

function goChapter(delta) {
    if (chLock) return;
    var next = currentChapter + delta;
    if (next < 0 || next >= TOTAL) return;
    loadChapter(next, delta > 0 ? 'top' : 'bottom');
}

async function loadChapter(idx, scrollTo, anchor) {
    if (idx < 0 || idx >= TOTAL) return;
    chLock = true;
    currentChapter = idx;
    history.replaceState(null, '', '/read/' + BOOK_ID + '/' + idx);
    expandCurrentChapter(idx);

    var loadEl = document.getElementById('ch-loading');
    var timer = setTimeout(function() { loadEl.style.display = 'block'; }, 200);
    try {
        var resp = await fetch('/api/full_chapter/' + BOOK_ID + '/' + idx);
        var data = await resp.json();
        document.getElementById('ch-title').textContent = data.title;
        document.getElementById('ch-content').innerHTML = data.html;
        // 等浏览器完成布局后再计算锚点位置
        requestAnimationFrame(function() {
            _autoCollapseArmed = false;  // 加载瞬间不自动折叠
            _prevAnchor = null;  // 新章节重置“上一次 active”
            computeRanges();
            updateHighlight();
        });
        _highlightSuppress = true;
        if (anchor) {
            requestAnimationFrame(function() { scrollToSection(anchor); _highlightSuppress = false; });
        } else {
            mainEl.style.scrollBehavior = 'auto';
            mainEl.scrollTop = (scrollTo === 'bottom') ? mainEl.scrollHeight : 0;
            requestAnimationFrame(function() { mainEl.style.scrollBehavior = 'smooth'; _highlightSuppress = false; });
        }
        updateNavLabel();
    } catch(e) { console.error(e); }
    finally { clearTimeout(timer); loadEl.style.display = 'none'; chLock = false; }
}

function updateNavLabel() {
    document.getElementById('ch-nav-label').textContent = (currentChapter + 1) + ' / ' + TOTAL;
    document.getElementById('ch-nav-prev').style.visibility = currentChapter > 0 ? 'visible' : 'hidden';
    document.getElementById('ch-nav-next').style.visibility = currentChapter < TOTAL - 1 ? 'visible' : 'hidden';
}

// ── 侧栏：折叠/展开 + 拖拽调宽 ──
var sideWrap = document.getElementById('side-wrap');
var SIDEBAR_MIN = 180;
var SIDEBAR_KEY_W = 'reader_sidebar_w';
var SIDEBAR_KEY_C = 'reader_sidebar_collapsed';

function setSidebarWidth(w, animate) {
    sideWrap.style.transition = animate ? '' : 'none';
    sideWrap.style.width = w + 'px';
}

function toggleSidebar() {
    var collapsed = sideWrap.classList.toggle('collapsed');
    document.getElementById('topbar').classList.toggle('collapsed', collapsed);
    if (collapsed) {
        // 清除内联宽度，让 .collapsed 规则生效（收成 76px 竖条）
        sideWrap.style.width = '';
        sideWrap.style.transition = '';
    } else {
        var saved = parseInt(localStorage.getItem(SIDEBAR_KEY_W) || '280', 10);
        setSidebarWidth(Math.max(SIDEBAR_MIN, saved), true);
    }
    localStorage.setItem(SIDEBAR_KEY_C, collapsed ? '1' : '0');
    requestAnimationFrame(computeRanges);
}

// 拖拽右缘实时调宽（☰ 图标随栏宽实时跟随）
(function initSidebarResize() {
    var rs = document.getElementById('resizer');
    var dragging = false, startX = 0, startW = 0;
    rs.addEventListener('mousedown', function(e) {
        e.preventDefault();
        dragging = true; startX = e.clientX; startW = sideWrap.offsetWidth;
        setSidebarWidth(startW, false);
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        var w = Math.max(SIDEBAR_MIN, Math.min(startW + e.clientX - startX, window.innerWidth - 160));
        setSidebarWidth(w, false);
    });
    document.addEventListener('mouseup', function() {
        if (!dragging) return;
        dragging = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        localStorage.setItem(SIDEBAR_KEY_W, sideWrap.offsetWidth);
        requestAnimationFrame(computeRanges);
    });
})();

// ── 初始化 ──
// 恢复侧栏状态（折叠与否 + 上次宽度）
(function initSidebarState() {
    var savedW = parseInt(localStorage.getItem(SIDEBAR_KEY_W) || '280', 10);
    if (localStorage.getItem(SIDEBAR_KEY_C) === '1') {
        sideWrap.classList.add('collapsed');
        document.getElementById('topbar').classList.add('collapsed');
        // 折叠时不能设内联宽度（会覆盖 .collapsed 的 76px）
        sideWrap.style.width = '';
    } else if (!isNaN(savedW) && savedW >= SIDEBAR_MIN) {
        setSidebarWidth(savedW, false);
    }
})();

expandCurrentChapter(currentChapter);
updateNavLabel();
requestAnimationFrame(function() {
    _autoCollapseArmed = false;  // 首次加载不自动折叠
    computeRanges();
    updateHighlight();
});

mainEl.addEventListener('wheel', function(e) {
    var atBottom = mainEl.scrollTop + mainEl.clientHeight >= mainEl.scrollHeight - 4;
    var atTop = mainEl.scrollTop <= 4;
    if (atBottom && e.deltaY > 30 && !chLock) goChapter(1);
    else if (atTop && e.deltaY < -30 && !chLock) goChapter(-1);
}, { passive: true });

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goChapter(1);
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   goChapter(-1);
});

// ── 正文内超链接跳转（原阅读器里的标题/脚注等跳转）──
document.getElementById('ch-content').addEventListener('click', function(e) {
    var a = e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    // 外部链接/空链接/协议链接放行（交给浏览器默认行为）
    if (!href || href === '#' || /^(https?:)?\/\/|^(mailto|data|javascript):/i.test(href)) return;
    e.preventDefault();

    var hashIdx = href.indexOf('#');
    var filePart = hashIdx >= 0 ? href.slice(0, hashIdx) : href;
    var anchor = hashIdx >= 0 ? href.slice(hashIdx + 1) : '';
    try { filePart = decodeURIComponent(filePart); anchor = decodeURIComponent(anchor); } catch (err) {}

    // 1) 锚点在当前章内容里 → 直接滚动定位
    if (anchor && document.getElementById(anchor)) {
        scrollToSection(anchor);
        return;
    }
    // 2) 跨章锚点 → 用锚点映射找到目标章并跳转
    if (anchor && anchorMap && anchorMap[anchor] !== undefined) {
        loadChapter(anchorMap[anchor], 'top', anchor);
        return;
    }
    // 3) 只有文件没有锚点 → 尝试跳转到该文件对应的章
    if (filePart) {
        var base = filePart.split('/').pop();
        for (var i = 0; i < tocTree.length; i++) {
            var fh = (tocTree[i].href || '').split('#')[0];
            if (fh === filePart || fh.split('/').pop() === base) {
                loadChapter(i, 'top');
                return;
            }
        }
    }
});

// 笔记界面入口：四角星 ✢ → 该书专门笔记页面（全书层L1 / 章节层L2）
// ═══════════════════════════════════════════
document.getElementById('aux-toggle').addEventListener('click', function() {
    location.href = '/notes/' + BOOK_ID;
});

// ═══════════════════════════════════════════════════════
// 辅助阅读版块（概念层 + 语义层）—— 独立 IIFE 模块 AuxLayer
// 概念(短≤30字) → concept_layer → 黄底 mark + 每词独立弹窗
// 语义(长>30字) → semantic_layer → 蓝下划线 mark + 书签 + 段落右侧弹窗
// 弹窗统一：标题 + 图钉锁定 + 点击置顶 + 悬停显示/移开自动关闭 + 可拉伸
// 记忆：选中即写 layer（当前为固定填充物），再选同文本直接命中。
// 后续专门的"辅助阅读"版块可在此命名空间上扩展/复写词条。
// ═══════════════════════════════════════════════════════
var AuxLayer = (function() {
    var CONCEPT_MAX_LEN = 30;        // 字数阈值（属于当前分类器实现，替换时可一并移除）
    var _semanticBookmarkId = 0;     // 书签自增序号（显示在书签上）
    var _popResize = null;           // 弹窗拉伸状态 {pop, sx, sy, sw, sh}
    var _popDrag = null;             // 弹窗拖动状态 {pop, sx, sy, lx, ty}

    var CONCEPT_ON = false;          // 辅助阅读模式开关
    var _popZ = 500;                 // 弹窗 z-index 计数（点击置顶，概念/语义共用）
    var _popCloseDelay = 400;        // 弹窗自动关闭延迟（从 mark 移到弹窗的缓冲，概念/语义共用）
    var _semListCache = null;        // 语义 list 缓存（首次拉取后复用，换章不重复请求）
    var _conListCache = null;        // 概念 list 缓存
    var _restoredSources = {};       // 已恢复 source 集合（防并发/重复包裹）

    // ── 开关：关闭只隐藏弹窗，保留已有书签/高亮（与概念层一致，mark 不消失）──
    document.getElementById('concept-toggle').addEventListener('click', function() {
        CONCEPT_ON = !CONCEPT_ON;
        this.classList.toggle('active', CONCEPT_ON);
        if (!CONCEPT_ON) hidePopsOnly();
    });

    // ── 概念/语义 分流器（可拆卸插件）──
    // 当前实现：按字数阈值判断（≤30 字符 = 概念；>30 = 语义）。
    // 以后接入 AI 自行判断"做段落还是做概念"时：只需替换 auxClassify 的实现
    // （这是唯一入口），applyHighlight 等所有调用点无需改动；删除本字数逻辑不影响其他功能。
    function auxClassify(text) {
        return (text.length <= CONCEPT_MAX_LEN) ? 'concept' : 'semantic';
    }

    // ── 弹窗公共装饰：图钉锁定 + 点击置顶 + 悬停保持/离开关闭（概念/语义共用）──
    function bringToFront(pop) {
        var cur = parseInt(window.getComputedStyle(pop).zIndex, 10) || 0;
        if (cur > _popZ) _popZ = cur;   // 吸收外部更高的初始 z
        pop.style.zIndex = ++_popZ;     // 最后点击的弹窗始终在最上层
    }
    function wirePopChrome(pop, st) {
        var pin = pop.querySelector('.sp-pin');
        if (pin) {
            pin.innerHTML = LOCK_ICON_UNPIN;
            pin.addEventListener('click', function(e) {
                e.stopPropagation();
                var locked = !st.getLocked();
                st.setLocked(locked);
                pin.classList.toggle('locked', locked);
                pin.innerHTML = locked ? LOCK_ICON_PIN : LOCK_ICON_UNPIN;
            });
        }
        pop.addEventListener('mousedown', function() { bringToFront(pop); });
        pop.addEventListener('mouseenter', function() { if (st.clearTimer) st.clearTimer(); });
        pop.addEventListener('mouseleave', function() { if (st.onLeave) st.onLeave(); });
    }

    // 统一弹窗创建（概念/语义共用）：标题栏 + 图钉 + 置顶 + 拉伸 + 悬停保持/关闭
    function createLayerPop(mark, opts) {
        var view = document.getElementById('chapter-view');
        var pop = document.createElement('div');
        pop.className = 'semantic-pop';
        pop.innerHTML = '<div class="sp-title"></div>' +
                        '<div class="sp-pin" title="锁定/解锁（锁定后移开不关闭）"></div>' +
                        '<div class="sp-body">加载中…</div>' +
                        '<div class="sp-resize" title="拖动调整大小"></div>';
        view.appendChild(pop);
        if (opts.title) pop.querySelector('.sp-title').textContent = opts.title;
        else pop.querySelector('.sp-title').style.display = 'none';
        opts.setLocked(false);
        wirePopChrome(pop, {
            getLocked: opts.getLocked,
            setLocked: opts.setLocked,
            clearTimer: opts.clearTimer,
            onLeave: opts.onLeave
        });
        var rs = pop.querySelector('.sp-resize');
        rs.addEventListener('mousedown', function(e) {
            e.preventDefault();
            // 不 stopPropagation → 冒泡到 pop 触发置顶
            _popResize = { pop: pop, sx: e.clientX, sy: e.clientY, sw: pop.offsetWidth, sh: pop.offsetHeight };
            document.body.style.cursor = 'nwse-resize';
        });
        // 拖动移动（按住标题栏）：用户拖动后暂停自动定位，位置以手动为准
        var title = pop.querySelector('.sp-title');
        if (title) {
            title.addEventListener('mousedown', function(e) {
                if (e.target.closest && e.target.closest('.sp-pin')) return;   // 图钉按钮不触发拖动
                e.preventDefault();
                pop._userPos = true;
                pop.classList.add('dragging');
                _popDrag = { pop: pop, sx: e.clientX, sy: e.clientY,
                             lx: parseFloat(pop.style.left) || 0, ty: parseFloat(pop.style.top) || 0 };
            });
        }
        if (opts.onContent) opts.onContent(pop);
        return pop;
    }

    // 公共 layer 请求（概念/语义共用，节省重复 fetch 代码）
    function layerGet(seg, query) {
        return fetch('/api/layer/' + seg + '/' + BOOK_ID + '?' + query).then(function(r) { return r.json(); });
    }

    // ── 概念层：每词一独立弹窗（hover 显示 / 移开自动关闭 / 图钉锁定 / 点击置顶）──
    function initConceptMark(mark) {
        mark._locked = false;
        mark._pop = createLayerPop(mark, {
            title: mark.getAttribute('data-term') || '',
            getLocked: function() { return mark._locked; },
            setLocked: function(v) { mark._locked = v; },
            clearTimer: function() { if (mark._cTimer) { clearTimeout(mark._cTimer); mark._cTimer = null; } },
            onLeave: function() { scheduleConceptClose(mark); },
            onContent: function(pop) { loadConceptContent(mark, pop); }
        });
        mark._pop.style.display = 'none';   // 初始隐藏，hover 时显示
    }
    async function loadConceptContent(mark, pop) {
        var term = mark.getAttribute('data-term') || '';
        try {
            var data = await layerGet('concept', 'term=' + encodeURIComponent(term));
            if (mark._pop !== pop) return;
            pop.querySelector('.sp-body').innerHTML = renderMarkdown(data.content || '（暂无内容）');
            // 选中即写入记忆：原文 + 段落锚点（content 由后端填充全书层文本）
            saveConceptMemo(term, mark.getAttribute('data-source') || term, mark.getAttribute('data-anchor') || '');
        } catch (err) { console.error('概念层请求失败', err); }
    }
    function showConceptPop(mark) {
        var pop = mark._pop;
        if (!pop) return;
        if (mark._cTimer) { clearTimeout(mark._cTimer); mark._cTimer = null; }
        positionConceptPop(pop, mark);
        pop.style.display = 'flex';
    }
    function scheduleConceptClose(mark) {
        var pop = mark._pop;
        if (!pop || mark._locked) return;
        if (mark._cTimer) clearTimeout(mark._cTimer);
        mark._cTimer = setTimeout(function() {
            if (mark._locked) return;
            pop.style.display = 'none';
        }, _popCloseDelay);
    }
    // 概念弹窗定位：根据当前布局在上下左右四个方向中选能完整放入可视区的位置
    // （优先右侧；放不下依次尝试左/下/上），全部放不下则 clamp 到可视区内。
    // 用户手动拖动过（pop._userPos）则保留手动位置，不再自动定位。
    function positionConceptPop(pop, mark) {
        if (pop._userPos) return;
        var view = document.getElementById('chapter-view');
        var vRect = view.getBoundingClientRect();
        var mRect = mark.getBoundingClientRect();
        var pw = pop.offsetWidth || 320;
        var ph = pop.offsetHeight || 400;
        var gap = 8;
        var mLeft = mRect.left - vRect.left;
        var mTop = mRect.top - vRect.top;
        var mBottom = mRect.bottom - vRect.top;
        var cands = [
            { l: mRect.right - vRect.left + gap, t: mTop - 6 },          // 右
            { l: mRect.left - vRect.left - pw - gap, t: mTop - 6 },      // 左
            { l: mLeft, t: mBottom + gap },                              // 下
            { l: mLeft, t: mTop - ph - gap },                            // 上
        ];
        var vw = view.clientWidth, vh = view.clientHeight;
        for (var i = 0; i < cands.length; i++) {
            var c = cands[i];
            if (c.l >= 0 && c.l + pw <= vw && c.t >= 0 && c.t + ph <= vh) {
                pop.style.left = c.l + 'px';
                pop.style.top = c.t + 'px';
                return;
            }
        }
        // 兜底：右优先，clamp 到可视区（顶部留出标题栏高度，避免被遮挡/裁剪）
        var l = Math.max(0, Math.min(mRect.right - vRect.left + gap, vw - pw));
        var t = Math.max(60, Math.min(mTop - 6, vh - ph - 8));
        pop.style.left = l + 'px';
        pop.style.top = t + 'px';
    }

    // ── 统一悬停委托：概念/语义 mark ──
    document.addEventListener('mouseover', function(e) {
        if (!CONCEPT_ON) return;
        var m = e.target.closest ? e.target.closest('mark.concept-hl, mark.semantic-hl') : null;
        if (!m) return;
        if (m.classList.contains('semantic-hl')) showSemanticPop(m._bookmark);
        else showConceptPop(m);
    });
    document.addEventListener('mouseout', function(e) {
        var m = e.target.closest ? e.target.closest('mark.concept-hl, mark.semantic-hl') : null;
        if (!m) return;
        if (m.classList.contains('semantic-hl')) scheduleSemanticClose(m._bookmark);
        else scheduleConceptClose(m);
    });

    // ── 选中高亮 ──
    document.getElementById('ch-content').addEventListener('mouseup', function(e) {
        if (!CONCEPT_ON) return;
        if (e.target.closest && (e.target.closest('mark') || e.target.closest('.sem-bookmark') ||
            e.target.closest('.semantic-pop'))) return;
        setTimeout(applyHighlight, 0);
    });

    function applyHighlight() {
        var sel = window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
        var range = sel.getRangeAt(0);
        var content = document.getElementById('ch-content');
        if (!content.contains(range.commonAncestorContainer)) return;
        var text = sel.toString().trim();
        if (text.length < 1 || text.length > 2000) return;   // 过短不处理；上限 2000 防误选整页
        // 跨段选区不处理：inline <mark> 无法合法包裹块级元素（<p>/<div>），
        // extractContents 降级会生成被浏览器拆分的无效 DOM → 正文空白
        if (rangeCrossesBlocks(range, content)) return;
        var kind = auxClassify(text);
        var mark = document.createElement('mark');
        mark.className = (kind === 'concept') ? 'concept-hl' : 'semantic-hl';
        mark.setAttribute('data-term', text);
        mark.setAttribute('data-kind', kind);
        try {
            range.surroundContents(mark);
        } catch (err) {
            // 选区部分跨越子元素（脚注 <sup> / 链接 <a> 等）时 surroundContents 抛
            // HierarchicalRequestError → 降级：extractContents 拆解后手动包裹
            try {
                var frag = range.extractContents();
                mark.appendChild(frag);
                range.insertNode(mark);
            } catch (err2) { return; }
        }
        sel.removeAllRanges();
        // 记录原文与所在段落前缀（记忆持久化：换章/离开后回来据此恢复高亮）
        mark.setAttribute('data-source', text);
        mark.setAttribute('data-anchor', paraPrefixOf(mark));
        if (kind === 'semantic') {
            createSemanticBookmark(mark, true);   // 语义：书签 + 自动弹窗
        } else {
            initConceptMark(mark);       // 概念：每词一独立弹窗（hover 显示）；记忆由 loadConceptContent 写入
        }
    }

    // 选区是否跨越多个块级元素（段落级）：inline <mark> 只能包裹同一块内的内容
    function rangeCrossesBlocks(range, content) {
        function blockOf(node) {
            var el = (node.nodeType === 1) ? node : node.parentNode;
            while (el && el !== content && el !== document.body) {
                var t = el.tagName;
                if (t === 'P' || t === 'DIV' || t === 'H1' || t === 'H2' || t === 'H3' ||
                    t === 'H4' || t === 'H5' || t === 'H6' || t === 'LI' || t === 'BLOCKQUOTE' ||
                    t === 'SECTION' || t === 'TR') return el;
                el = el.parentNode;
            }
            return null;
        }
        var sb = blockOf(range.startContainer);
        var eb = blockOf(range.endContainer);
        if (sb && eb) return sb !== eb;
        // 任一端定位不到块（悬在 content 直接子级）→ 保守按跨段处理
        return range.startContainer !== range.endContainer;
    }

    // ── 语义：书签（序号 + ×删除 + 深浅色开关）→ 段落右侧弹窗 ──
    // 语义书签创建（选中与恢复共用；autoPop=false 时不自动弹窗）
    function createSemanticBookmark(mark, autoPop) {
        var view = document.getElementById('chapter-view');
        var seq = ++_semanticBookmarkId;
        var bm = document.createElement('button');
        bm.className = 'sem-bookmark active';   // 默认开启（深色）
        bm.type = 'button';
        bm.title = '点击展开/收起语义内容';
        bm.setAttribute('data-id', seq);
        bm.setAttribute('data-term', mark.getAttribute('data-term') || '');
        bm.innerHTML = '<span class="bm-rect"><span class="bm-num">' + seq + '</span></span>' +
                       '<span class="bm-tri"></span>';
        bm.addEventListener('click', function(e) { e.stopPropagation(); showSemanticPop(bm); });
        bm.addEventListener('mouseenter', function() { clearTimeout(bm._closeTimer); showSemanticPop(bm); });
        bm.addEventListener('mouseleave', function() { scheduleSemanticClose(bm); });
        view.appendChild(bm);
        mark._bookmark = bm; bm._mark = mark; bm._on = true;
        positionSemantic(bm, mark);
        createPop(bm, mark, autoPop !== false);
        return bm;
    }

    // 定位（文档坐标 = 视口差，滚动自动跟随；不加 scrollTop）
    // 语义层固定在段落右侧；弹窗 clamp 到可视区（顶部避开标题栏），用户拖动后保留手动位置。
    function positionSemantic(bm, mark) {
        var view = document.getElementById('chapter-view');
        var vRect = view.getBoundingClientRect();
        var mRect = mark.getBoundingClientRect();
        // 书签垂直居中于选中字段（书签高 44 → 偏移 22）
        bm.style.top = (mRect.top - vRect.top + (mRect.height / 2) - 22) + 'px';
        var pop = bm._pop;
        if (pop) {
            if (pop._userPos) return;   // 用户拖过 → 保留手动位置
            var cRect = document.getElementById('ch-content').getBoundingClientRect();
            var pw = pop.offsetWidth || 320, ph = pop.offsetHeight || 400;
            var vh = view.clientHeight;
            var l = cRect.right - vRect.left + 16;                 // 正文右缘 + 1-2 字符
            var t = mRect.top - vRect.top - 6;
            l = Math.max(8, l);                                    // 防左溢出
            t = Math.max(60, Math.min(t, vh - ph - 8));            // 顶部避开标题栏，底部不溢出
            pop.style.left = l + 'px';
            pop.style.top = t + 'px';
        }
    }

    // ── 语义弹窗显示/关闭（悬停驱动 + 图钉锁定）──
    function showSemanticPop(bm) {
        if (!bm) return;
        if (bm._closeTimer) { clearTimeout(bm._closeTimer); bm._closeTimer = null; }
        bm._on = true;
        bm.classList.add('active');
        if (bm._mark) bm._mark.classList.remove('off');   // 开启 → 下划线保持
        if (bm._pop) {
            positionSemantic(bm, bm._mark);
            bm._pop.style.display = 'flex';
            loadPopContent(bm, bm._pop);
        }
    }
    function hideSemanticPop(bm) {
        if (!bm || bm._locked) return;                    // 锁定后不自动关闭
        bm._on = false;
        bm.classList.remove('active');
        if (bm._mark) bm._mark.classList.add('off');      // 关闭 → 下划线隐藏
        if (bm._pop) bm._pop.style.display = 'none';
    }
    function scheduleSemanticClose(bm) {
        if (!bm || bm._locked) return;
        if (bm._closeTimer) clearTimeout(bm._closeTimer);
        bm._closeTimer = setTimeout(function() { hideSemanticPop(bm); }, _popCloseDelay);
    }

    // 语义弹窗：段落右侧，白底淡蓝边框，标题(序号) + 图钉 + 拉伸（与概念弹窗共用 createLayerPop）
    function createPop(bm, mark, show) {
        bm._locked = false;
        bm._pop = createLayerPop(mark, {
            title: '语义 · ' + bm.getAttribute('data-id'),
            getLocked: function() { return bm._locked; },
            setLocked: function(v) { bm._locked = v; },
            clearTimer: function() { clearTimeout(bm._closeTimer); },
            onLeave: function() { scheduleSemanticClose(bm); },
            onContent: function(pop) { loadPopContent(bm, pop); }
        });
        positionSemantic(bm, mark);
        if (show === false) bm._pop.style.display = 'none';   // 恢复场景不自动弹窗
    }

    async function loadPopContent(bm, pop) {
        var term = bm.getAttribute('data-term') || '';
        try {
            var data = await layerGet('semantic', 'text=' + encodeURIComponent(term));
            if (bm._pop !== pop) return;   // 书签点击不依赖开关，仅防竞态
            pop.querySelector('.sp-body').innerHTML = renderMarkdown(data.content || '（暂无内容）');
            // 选中即写入记忆：原文 + 段落锚点（content 由后端填充全书层文本）
            saveSemanticMemo(term,
                (bm._mark && bm._mark.getAttribute('data-source')) || term,
                (bm._mark && bm._mark.getAttribute('data-anchor')) || '');
        } catch (err) { console.error('语义层请求失败', err); }
    }

    // ── 弹窗拉伸（共享管理器，无大小边界）──
    document.addEventListener('mousemove', function(e) {
        if (_popDrag) {
            var d = _popDrag;
            d.pop.style.left = (d.lx + e.clientX - d.sx) + 'px';
            d.pop.style.top = (d.ty + e.clientY - d.sy) + 'px';
            return;
        }
        if (_popResize) {
            var r = _popResize;
            r.pop.style.width = (r.sw + e.clientX - r.sx) + 'px';
            r.pop.style.height = (r.sh + e.clientY - r.sy) + 'px';
        }
    });
    document.addEventListener('mouseup', function() {
        if (_popDrag) {
            _popDrag.pop.classList.remove('dragging');
            _popDrag = null;
        }
        if (_popResize) { _popResize = null; document.body.style.cursor = ''; }
    });

    // ── 记忆写入（选中即缓存 → layer 表；content 缺省时后端自动填充全书层文本）──
    function saveSemanticMemo(text, sourceText, anchorText) {
        fetch('/api/layer/semantic/' + BOOK_ID, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, content: '', source_text: sourceText || text, anchor_text: anchorText || '' })
        }).then(function(r) { if (r.ok) _semListCache = null; })   // 记忆更新 → 缓存失效，下次恢复重新拉取
          .catch(function() {});
    }
    function saveConceptMemo(term, sourceText, anchorText) {
        fetch('/api/layer/concept/' + BOOK_ID, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ term: term, content: '', source_text: sourceText || term, anchor_text: anchorText || '' })
        }).then(function(r) { if (r.ok) _conListCache = null; })   // 记忆更新 → 缓存失效，下次恢复重新拉取
          .catch(function() {});
    }

    // 仅隐藏所有弹窗（关闭开关用）：书签/高亮保留，并同步为“关闭”态（浅色/无下划线），
    // 避免“深色书签却无弹窗”的不一致；重开开关后点书签一次即可重新展开
    function hidePopsOnly() {
        document.querySelectorAll('.semantic-pop').forEach(function(p) { p.style.display = 'none'; });
        document.querySelectorAll('.sem-bookmark').forEach(function(b) {
            b._on = false;
            b.classList.remove('active');
            if (b._mark) b._mark.classList.add('off');
        });
    }

    // ── 换章清理（整章离开：弹窗/书签全清；概念/语义弹窗都是 .semantic-pop）──
    function reset() {
        document.querySelectorAll('.semantic-pop').forEach(function(p) { p.remove(); });
        document.querySelectorAll('.sem-bookmark').forEach(function(b) { b.remove(); });
        _semanticBookmarkId = 0;
        _restoredSources = {};   // 新章节内容需重新恢复，清空防重集合
    }

    // ═══════════════════════════════════════════════════════
    // 记忆恢复：先记录后识别 —— 选中时已把原文(source_text)和所在段落前缀
    // (anchor_text) 写入 layer 表；离开/换章/刷新后回来，据此在当前章正文中
    // 重新定位并恢复高亮 mark 与书签（语义层），保证记忆不丢失。
    // ═══════════════════════════════════════════════════════
    function paraPrefixOf(el) {
        var content = document.getElementById('ch-content');
        var node = el;
        while (node && node !== content && node !== document.body) {
            if (node.nodeType === 1 && /^(P|DIV|H1|H2|H3|H4|H5|H6|LI|BLOCKQUOTE)$/.test(node.tagName)) break;
            node = node.parentNode;
        }
        if (!node || node === document.body) return '';
        return (node.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 40);
    }

    // 在容器内按原文匹配并包裹 mark（单文本节点内；跨节点暂跳过，避免破坏正文 DOM）
    function wrapMarkIn(container, text, kind) {
        if (!text) return null;
        var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        var nodes = [], offsets = [], full = '', n;
        while ((n = walker.nextNode())) { nodes.push(n); offsets.push(full.length); full += n.textContent; }
        var idx = full.indexOf(text);
        if (idx < 0) return null;
        var endIdx = idx + text.length;
        var si = -1, so = 0, ei = -1, eo = 0;
        for (var i = 0; i < nodes.length; i++) {
            var s = offsets[i], e = offsets[i] + nodes[i].textContent.length;
            if (si < 0 && idx >= s && idx <= e) { si = i; so = idx - s; }
            if (ei < 0 && endIdx >= s && endIdx <= e) { ei = i; eo = endIdx - s; }
        }
        if (si < 0 || ei < 0 || si !== ei) return null;   // 跨文本节点（粗体/斜体分隔）暂跳过
        var tn = nodes[si];
        var before = document.createTextNode(tn.textContent.slice(0, so));
        var mid = document.createTextNode(tn.textContent.slice(so, eo));
        var after = document.createTextNode(tn.textContent.slice(eo));
        var mark = document.createElement('mark');
        mark.className = (kind === 'concept') ? 'concept-hl' : 'semantic-hl';
        mark.setAttribute('data-term', text);
        mark.setAttribute('data-kind', kind);
        mark.setAttribute('data-source', text);
        mark.appendChild(mid);
        var parent = tn.parentNode;
        parent.replaceChild(after, tn);
        parent.insertBefore(mark, after);
        parent.insertBefore(before, mark);
        return mark;
    }

    function restoreOne(content, item, kind) {
        var source = (kind === 'concept') ? (item.source_text || item.term) : (item.source_text || '');
        if (!source) return;
        if (!content.isConnected) return;          // 内容已被换章替换 → 跳过（防孤儿书签）
        if (_restoredSources[source]) return;      // 已恢复过 → 跳过（防重复包裹）
        var anchor = (item.anchor_text || '').replace(/\s+/g, ' ');
        // 优先按段落锚点定位到原段落（避免短词条全书误标）
        var target = null;
        if (anchor) {
            var paras = content.querySelectorAll('p, div, h1, h2, h3, h4, h5, h6, li, blockquote');
            for (var i = 0; i < paras.length; i++) {
                if ((paras[i].textContent || '').replace(/\s+/g, ' ').indexOf(anchor) >= 0) {
                    target = paras[i]; break;
                }
            }
        }
        if (!target) {
            if (kind === 'concept') return;   // 锚点不在本章 → 短词条不全书匹配，避免误标
            target = content;                 // 语义原文较长，全书匹配一次
        }
        var mark = wrapMarkIn(target, source, kind);
        if (mark) {
            _restoredSources[source] = true;
            if (kind === 'semantic') createSemanticBookmark(mark, false);   // 恢复：不自动弹窗
            else initConceptMark(mark);   // 概念：恢复弹窗（hover 显示）
        }
    }

    // 拉取语义/概念列表（带缓存：书未变则首次拉取后复用，换章不重复请求）
    async function _getSemItems() {
        if (!_semListCache) {
            var r = await fetch('/api/layer/semantic_list/' + BOOK_ID);
            _semListCache = (await r.json()).items || [];
        }
        return _semListCache;
    }
    async function _getConItems() {
        if (!_conListCache) {
            var r = await fetch('/api/layer/concept_list/' + BOOK_ID);
            _conListCache = (await r.json()).items || [];
        }
        return _conListCache;
    }

    async function restoreHighlights() {
        var content = document.getElementById('ch-content');
        if (!content || !content.isConnected) return;   // 内容已被替换则跳过
        try {
            var sem = await _getSemItems();
            var con = await _getConItems();
            for (var i = 0; i < sem.length; i++) restoreOne(content, sem[i], 'semantic');
            for (var j = 0; j < con.length; j++) restoreOne(content, con[j], 'concept');
        } catch (e) { console.error('恢复高亮失败', e); }
    }

    return {
        isOn: function() { return CONCEPT_ON; },
        reset: reset,
        restore: restoreHighlights,
    };
})();

// ═══════════════════════════════════════════
// 换章统一清理：书签/弹窗/概念弹窗 一并清除
// （唯一一处 loadChapter 包装，避免多次包装冲突）
// ═══════════════════════════════════════════
var _origLoad = loadChapter;
loadChapter = function(idx, scrollTo, anchor) {
    AuxLayer.reset();
    return _origLoad(idx, scrollTo, anchor).then(function() {
        AuxLayer.restore();   // 新章内容加载后恢复已记录的高亮/书签
    });
};

// 页面加载完成后恢复已记录的高亮/书签（离开页面再回来依然可见）
setTimeout(function() { AuxLayer.restore(); }, 400);

</script>
</body>
</html>
